<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD__bear | Luxury Fashion 🐻</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;600;900&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --gold: #d4af37;
            --black: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --accent: #25d366;
        }

        * { box-sizing: border-box; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        body { 
            font-family: 'Cairo', sans-serif; 
            background: var(--black); 
            color: white; margin: 0; overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, #1a1a1a 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #111 0%, transparent 40%);
        }

        /* هيدر سينمائي */
        header { 
            height: 60vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0), var(--black)),
                        url('https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&q=80&w=1500');
            background-size: cover; background-position: center;
            text-align: center; border-bottom: 1px solid var(--glass);
        }

        header h1 { 
            font-family: 'Playfair Display', serif; font-size: 5rem; 
            margin: 0; letter-spacing: 5px; text-transform: uppercase;
            background: linear-gradient(45deg, #fff, var(--gold), #fff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.5));
        }

        header p { font-weight: 300; letter-spacing: 3px; opacity: 0.6; margin-top: 10px; }

        .container { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); 
            gap: 50px; max-width: 1400px; margin: -100px auto 100px; padding: 0 30px;
        }

        /* بطاقة المنتج الفخمة */
        .card { 
            background: var(--glass); border-radius: 40px; overflow: hidden; 
            backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1);
            position: relative; cursor: pointer;
        }

        .card::before { /* تأثير اللمعة */
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-25deg); transition: 0.8s;
        }

        .card:hover::before { left: 150%; }

        .card:hover { transform: translateY(-20px); box-shadow: 0 30px 60px rgba(0,0,0,0.8); border-color: var(--gold); }

        .img-box { width: 100%; height: 500px; overflow: hidden; position: relative; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: 1s; }
        .card:hover img { transform: scale(1.1) rotate(2deg); filter: brightness(0.7); }

        .card-info { padding: 35px; text-align: center; background: rgba(0,0,0,0.4); }
        .card-info h3 { font-size: 1.8rem; margin: 0; font-weight: 900; letter-spacing: 1px; }
        .price { color: var(--gold); font-size: 2.2rem; font-weight: 900; margin: 15px 0; display: block; font-family: 'Playfair Display', serif; }

        /* المودال الاحترافي */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 1000;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }

        .modal-content {
            background: #000; border: 1px solid var(--gold); width: 100%; max-width: 1200px;
            display: grid; grid-template-columns: 1fr 1fr; border-radius: 50px;
            overflow: hidden; position: relative; box-shadow: 0 0 100px rgba(212, 175, 55, 0.2);
        }

        .modal-close {
            position: absolute; top: 30px; left: 30px; color: #fff; 
            font-size: 2rem; cursor: pointer; z-index: 10;
        }

        .modal-img { height: 700px; background: #111; }
        .modal-img img { width: 100%; height: 100%; object-fit: cover; }

        .modal-details { padding: 60px; display: flex; flex-direction: column; justify-content: center; }
        .modal-details h2 { font-size: 3.5rem; margin: 0; font-family: 'Playfair Display', serif; }
        .modal-details .modal-price { color: var(--gold); font-size: 3.5rem; font-weight: 900; margin: 30px 0; }
        
        .buy-btn {
            background: var(--gold); color: #000; padding: 25px; 
            border-radius: 20px; text-decoration: none; font-weight: 900;
            font-size: 1.5rem; text-align: center; display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .buy-btn:hover { background: #fff; transform: scale(1.05); }

        footer { text-align: center; padding: 50px; opacity: 0.3; letter-spacing: 2px; }

        @media (max-width: 900px) {
            .modal-content { grid-template-columns: 1fr; }
            .modal-img { height: 400px; }
            header h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>AD__bear</h1>
        <p>H A U T E &nbsp; C O U T U R E</p>
    </header>

    <div class="container">
        <div class="card" onclick="openShowcase('قميص الملكي', '220 درهم', '0e03061c982d648fbfa56f692930f03b.jpg', 'قطعة فنية من القطن المصري الخالص، مصممة لأصحاب الذوق الرفيع الذين يبحثون عن التميز.')">
            <div class="img-box">
                <img src="0e03061c982d648fbfa56f692930f03b.jpg">
            </div>
            <div class="card-info">
                <h3>قميص كاجوال أنيق</h3>
                <span class="price">220 DH</span>
            </div>
        </div>

        <div class="card" onclick="openShowcase('هودي الأناقة', '199 درهم', '0e2bcdba3fc4e544b30e9af4d3e37ff6.jpg', 'هودي عصري بتفاصيل مخملية، يعيد تعريف الراحة بمفهوم الفخامة العصرية.')">
            <div class="img-box">
                <img src="0e2bcdba3fc4e544b30e9af4d3e37ff6.jpg">
            </div>
            <div class="card-info">
                <h3>هودي عصري مريح</h3>
                <span class="price">199 DH</span>
            </div>
        </div>

        <div class="card" onclick="openShowcase('جاكيت النخبة', '294 درهم', 'd24dbf3ebd288e1eb642aeaf6e189fbd.jpg', 'جاكيت شتوي بمعايير عالمية، عزل حراري تام مع تصميم يخطف الأنظار في كل مكان.')">
            <div class="img-box">
                <img src="d24dbf3ebd288e1eb642aeaf6e189fbd.jpg">
            </div>
            <div class="card-info">
                <h3>جاكيت شتوي فاخر</h3>
                <span class="price">294 DH</span>
            </div>
        </div>
    </div>

    <div class="modal" id="showcase">
        <div class="modal-content">
            <span class="modal-close" onclick="closeShowcase()">&times;</span>
            <div class="modal-img">
                <img id="showImg" src="">
            </div>
            <div class="modal-details">
                <h2 id="showTitle">المنتج الملكي</h2>
                <div class="modal-price" id="showPrice">000 DH</div>
                <p id="showDesc" style="font-size: 1.2rem; line-height: 2; opacity: 0.7; margin-bottom: 40px;"></p>
                <a href="https://wa.me/212770940367" class="buy-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i> اطلب القطعة الآن
                </a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 AD__bear LUXURY GROUP
    </footer>

    <script>
        function openShowcase(name, price, img, desc) {
            document.getElementById('showTitle').innerText = name;
            document.getElementById('showPrice').innerText = price;
            document.getElementById('showDesc').innerText = desc;
            document.getElementById('showImg').src = img;
            document.getElementById('showcase').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeShowcase() {
            document.getElementById('showcase').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(e) {
            if (e.target == document.getElementById('showcase')) closeShowcase();
        }
    </script>

</body>
</html>
