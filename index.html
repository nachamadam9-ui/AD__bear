<style>
:root{
    --bg:#000;
    --card:#0d0d0d;
    --royal:#6a040f;
    --royal-light:#9d0208;
    --white:#fff;
    --gray:#999;
}

/* Global */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Cairo',sans-serif;
    background:linear-gradient(to bottom,#000,#070707);
    color:var(--white);
    overflow-x:hidden;
}

/* Scrollbar */
::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#111;
}

::-webkit-scrollbar-thumb{
    background:var(--royal);
    border-radius:20px;
}

/* Header */
header{
    text-align:center;
    padding:50px 20px;
    border-bottom:1px solid rgba(255,255,255,.1);
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(10px);
    position:sticky;
    top:0;
    z-index:999;
}

header h1{
    font-size:2.5rem;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 20px rgba(106,4,15,.7);
}

/* Container */
.container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:25px;
    padding:30px;
    max-width:1300px;
    margin:auto;
}

/* Cards */
.card{
    background:linear-gradient(145deg,#0d0d0d,#151515);
    border-radius:18px;
    overflow:hidden;
    transition:.4s ease;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.05);
    position:relative;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
}

.card::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(
        120deg,
        transparent,
        rgba(255,255,255,.08),
        transparent
    );
    transition:.7s;
}

.card:hover::before{
    left:100%;
}

.card:hover{
    transform:translateY(-10px) scale(1.02);
    border:1px solid var(--royal);
    box-shadow:0 15px 40px rgba(106,4,15,.5);
}

.card img{
    width:100%;
    height:320px;
    object-fit:cover;
    transition:.5s ease;
}

.card:hover img{
    transform:scale(1.06);
}

.card-info{
    padding:20px;
    text-align:center;
}

.card-info h3{
    font-size:1.3rem;
    margin-bottom:10px;
}

.price{
    color:#ff4d6d;
    font-size:1.2rem;
    font-weight:bold;
    display:block;
    margin-bottom:15px;
}

.btn-fake{
    width:100%;
    border:none;
    padding:12px;
    border-radius:12px;
    background:linear-gradient(to right,var(--royal),var(--royal-light));
    color:#fff;
    font-weight:bold;
    font-size:1rem;
    transition:.3s;
}

.card:hover .btn-fake{
    transform:scale(1.03);
}

/* Modal */
#productModal{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.92);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:99999;
    padding:20px;
}

.modal-box{
    background:linear-gradient(145deg,#111,#191919);
    border-radius:25px;
    padding:25px;
    max-width:480px;
    width:100%;
    text-align:center;
    position:relative;
    border:1px solid rgba(255,255,255,.08);
    animation:fade .4s ease;
    box-shadow:0 0 40px rgba(106,4,15,.4);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px) scale(.9);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

/* Close */
.close-btn{
    position:absolute;
    top:15px;
    left:20px;
    font-size:2rem;
    cursor:pointer;
    transition:.3s;
}

.close-btn:hover{
    color:#ff4d6d;
    transform:rotate(90deg);
}

/* Modal Image */
#modalImg{
    width:100%;
    border-radius:18px;
    max-height:380px;
    object-fit:cover;
    margin-bottom:20px;
}

/* Modal Text */
#modalTitle{
    font-size:1.6rem;
    margin-bottom:10px;
}

#modalPrice{
    color:#ff4d6d;
    font-size:1.7rem;
    font-weight:bold;
    margin-bottom:20px;
}

/* WhatsApp Button */
.wa-link{
    display:block;
    width:100%;
    padding:16px;
    border-radius:14px;
    background:linear-gradient(to right,#25d366,#128c7e);
    color:white;
    text-decoration:none;
    font-size:1.1rem;
    font-weight:bold;
    transition:.3s ease;
    box-shadow:0 10px 25px rgba(37,211,102,.3);
}

.wa-link:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(37,211,102,.5);
}

/* Responsive */
@media(max-width:768px){

    header h1{
        font-size:2rem;
    }

    .container{
        padding:20px;
        gap:20px;
    }

    .card img{
        height:280px;
    }

    .modal-box{
        padding:20px;
    }

    #modalTitle{
        font-size:1.3rem;
    }

    #modalPrice{
        font-size:1.4rem;
    }

}
</style>
